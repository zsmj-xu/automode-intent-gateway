[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litellm-auto-intent"
version = "0.1.0"
description = "A minimal intent and risk classifier for LiteLLM request logs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
dev = ["coverage[toml]>=7.6,<8"]

[project.scripts]
auto-intent = "automode_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["automode_gateway"]

[tool.coverage.run]
source = ["automode_gateway"]
branch = true
omit = ["automode_gateway/__main__.py", "automode_gateway/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
